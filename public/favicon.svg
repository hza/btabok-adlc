<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0eff5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="48" height="48" rx="9" fill="url(#bg)"/>
  <!-- Outer border matching canvas frame style -->
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="8.5"
        fill="none" stroke="#1c1c1e" stroke-width="1.5"/>

  <!-- Book spine (left strip, canvas left-sidebar style) -->
  <rect x="7" y="9" width="6" height="30" rx="1" fill="#1c1c1e"/>

  <!-- Book cover body -->
  <rect x="13" y="9" width="21" height="30" rx="1"
        fill="#ffffff" stroke="#1c1c1e" stroke-width="1.5"/>

  <!-- Page-edge stack (right side, thin gray lines) -->
  <rect x="34" y="10.5" width="2" height="27" rx="0.5" fill="#1c1c1e" opacity="0.18"/>
  <rect x="36" y="11.5" width="1.5" height="25" rx="0.5" fill="#1c1c1e" opacity="0.10"/>

  <!-- Ruled lines on cover -->
  <line x1="17" y1="20" x2="30" y2="20" stroke="#1c1c1e" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="17" y1="25" x2="30" y2="25" stroke="#1c1c1e" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="17" y1="30" x2="25" y2="30" stroke="#1c1c1e" stroke-width="1.2" stroke-linecap="round"/>
</svg>
